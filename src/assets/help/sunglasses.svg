<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#0F172A" rx="16"/>
  <g transform="translate(0, 50)">
    <!-- Dark Tinted Sunglasses Frame -->
    <path d="M 120 160 L 380 160 L 360 250 C 320 270, 270 240, 250 210 C 230 240, 180 270, 140 250 Z" fill="#090D16" stroke="#EAB308" stroke-width="8"/>
    
    <!-- Left Dark Tint Lens -->
    <ellipse cx="185" cy="205" rx="55" ry="40" fill="#020617" stroke="#EAB308" stroke-width="4"/>
    <!-- Right Dark Tint Lens -->
    <ellipse cx="315" cy="205" rx="55" ry="40" fill="#020617" stroke="#EAB308" stroke-width="4"/>

    <!-- Temple Arms -->
    <path d="M 60 170 L 125 165 M 375 165 L 440 170" stroke="#EAB308" stroke-width="10" stroke-linecap="round"/>

    <!-- Label -->
    <rect x="150" y="290" width="200" height="40" fill="#1E293B" stroke="#EAB308" stroke-width="2" rx="8"/>
    <text x="250" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#EAB308">OOXii SUNGLASSES</text>
  </g>
</svg>
