<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#0F172A" rx="16"/>
  <!-- Distance Spectacles Frame -->
  <g transform="translate(0, 50)">
    <path d="M 60 180 L 140 180 A 60 50 0 0 0 240 180 L 260 180 A 60 50 0 0 0 360 180 L 440 180" stroke="#38BDF8" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Left Lens -->
    <ellipse cx="190" cy="200" rx="55" ry="45" fill="#1E293B" stroke="#38BDF8" stroke-width="8"/>
    <ellipse cx="190" cy="200" rx="55" ry="45" fill="#38BDF8" opacity="0.15"/>

    <!-- Right Lens -->
    <ellipse cx="310" cy="200" rx="55" ry="45" fill="#1E293B" stroke="#38BDF8" stroke-width="8"/>
    <ellipse cx="310" cy="200" rx="55" ry="45" fill="#38BDF8" opacity="0.15"/>

    <!-- Bridge -->
    <path d="M 245 190 Q 250 175 255 190" stroke="#38BDF8" stroke-width="10" fill="none"/>

    <!-- Distance Vision Label -->
    <rect x="150" y="290" width="200" height="40" fill="#1E293B" stroke="#38BDF8" stroke-width="2" rx="8"/>
    <text x="250" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">DISTANCE GLASSES</text>
  </g>
</svg>
