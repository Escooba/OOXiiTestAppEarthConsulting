<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#0F172A" rx="16"/>
  <!-- Split Screen Chart -->
  <rect x="30" y="40" width="220" height="420" fill="#DC2626" rx="12"/>
  <rect x="250" y="40" width="220" height="420" fill="#16A34A" rx="12"/>

  <!-- Left Red Side Tumbling E symbols -->
  <text x="140" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">RED SIDE</text>
  <path d="M110 130 h50 v10 h-40 v15 h30 v10 h-30 v15 h40 v10 h-50 z" fill="#000000"/>
  <path d="M115 220 h40 v8 h-32 v12 h24 v8 h-24 v12 h32 v8 h-40 z" fill="#000000"/>
  <path d="M120 310 h30 v6 h-24 v9 h18 v6 h-18 v9 h24 v6 h-30 z" fill="#000000"/>

  <!-- Right Green Side Tumbling E symbols -->
  <text x="360" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">GREEN SIDE</text>
  <path d="M330 130 h50 v10 h-40 v15 h30 v10 h-30 v15 h40 v10 h-50 z" fill="#000000"/>
  <path d="M335 220 h40 v8 h-32 v12 h24 v8 h-24 v12 h32 v8 h-40 z" fill="#000000"/>
  <path d="M340 310 h30 v6 h-24 v9 h18 v6 h-18 v9 h24 v6 h-30 z" fill="#000000"/>

  <!-- Divider Line -->
  <line x1="250" y1="40" x2="250" y2="460" stroke="#FFFFFF" stroke-width="4"/>
</svg>
