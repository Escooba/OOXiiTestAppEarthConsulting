<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#F8FAFC" rx="16"/>
  <!-- Card Header -->
  <rect x="40" y="30" width="420" height="440" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" rx="12"/>
  <text x="250" y="65" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A">OOXii NEAR VISION TEST CARD (33-40cm)</text>
  <line x1="60" y1="80" x2="440" y2="80" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Line N1 -->
  <text x="80" y="125" font-family="monospace" font-size="14" font-weight="bold" fill="#64748B">N1 / Line 1</text>
  <path d="M180 110 h25 v5 h-20 v8 h15 v5 h-15 v8 h20 v5 h-25 z M230 110 h25 v5 h-20 v8 h15 v5 h-15 v8 h20 v5 h-25 z M280 110 h5 v31 h20 v-31 h5 v31 h-30 z" fill="#0F172A"/>

  <!-- Line N2 -->
  <text x="80" y="185" font-family="monospace" font-size="14" font-weight="bold" fill="#64748B">N2 / Line 2</text>
  <path d="M180 170 h20 v4 h-16 v6 h12 v4 h-12 v6 h16 v4 h-20 z M230 170 h4 v24 h16 v-24 h4 v24 h-24 z" fill="#0F172A"/>

  <!-- Line N3 -->
  <text x="80" y="245" font-family="monospace" font-size="14" font-weight="bold" fill="#64748B">N3 / Line 3</text>
  <path d="M180 230 h16 v3 h-13 v5 h10 v3 h-10 v5 h13 v3 h-16 z" fill="#0F172A"/>

  <!-- Line N4 -->
  <text x="80" y="305" font-family="monospace" font-size="14" font-weight="bold" fill="#64748B">N4 / Line 4</text>
  <path d="M180 295 h14 v3 h-11 v4 h8 v3 h-8 v4 h11 v3 h-14 z" fill="#0F172A"/>

  <!-- BAKED-IN HIGHLIGHT: Line N5 -->
  <rect x="70" y="342" width="340" height="34" fill="#EF4444" fill-opacity="0.14" stroke="#DC2626" stroke-width="3" rx="8"/>
  <rect x="70" y="325" width="170" height="17" fill="#DC2626" rx="4"/>
  <text x="78" y="337" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Example N-rating line (N5)</text>

  <text x="80" y="365" font-family="monospace" font-size="14" font-weight="bold" fill="#DC2626">N5 / Line 5</text>
  <path d="M180 358 h10 v2 h-8 v3 h6 v2 h-6 v3 h8 v2 h-10 z M210 358 h10 v2 h-8 v3 h6 v2 h-6 v3 h8 v2 h-10 z" fill="#0F172A"/>

  <!-- Ruler scale on card edge -->
  <line x1="420" y1="100" x2="420" y2="440" stroke="#94A3B8" stroke-width="2"/>
  <line x1="410" y1="120" x2="420" y2="120" stroke="#94A3B8" stroke-width="2"/>
  <line x1="410" y1="180" x2="420" y2="180" stroke="#94A3B8" stroke-width="2"/>
  <line x1="410" y1="240" x2="420" y2="240" stroke="#94A3B8" stroke-width="2"/>
  <line x1="410" y1="300" x2="420" y2="300" stroke="#94A3B8" stroke-width="2"/>
  <line x1="410" y1="360" x2="420" y2="360" stroke="#94A3B8" stroke-width="2"/>
</svg>
