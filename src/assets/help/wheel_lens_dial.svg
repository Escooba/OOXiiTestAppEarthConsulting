<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#0F172A" rx="16"/>
  <!-- Wheel Apparatus Body -->
  <rect x="40" y="40" width="420" height="420" fill="#1E293B" stroke="#334155" stroke-width="4" rx="24"/>

  <!-- Left/Right Dial Housing -->
  <circle cx="250" cy="250" r="170" fill="#090D16" stroke="#475569" stroke-width="6"/>

  <!-- Lens Dial Wheel -->
  <circle cx="250" cy="250" r="130" fill="#1E293B" stroke="#38BDF8" stroke-width="4"/>

  <!-- Selected Lens Marking Window -->
  <circle cx="250" cy="150" r="36" fill="#020617" stroke="#A855F7" stroke-width="4"/>
  <text x="250" y="156" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#A855F7">+1.50</text>
  <text x="250" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38BDF8">POWER DIAL</text>

  <!-- BAKED-IN HIGHLIGHT: Plus Dial -->
  <rect x="88" y="215" width="84" height="85" fill="#EF4444" fill-opacity="0.15" stroke="#DC2626" stroke-width="3" rx="12"/>
  <rect x="88" y="196" width="55" height="17" fill="#DC2626" rx="4"/>
  <text x="93" y="209" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Plus (+)</text>

  <g transform="translate(130, 260)">
    <circle cx="0" cy="0" r="30" fill="#334155" stroke="#22C55E" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#22C55E">+</text>
    <text x="0" y="-38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94A3B8">PLUS</text>
  </g>

  <!-- BAKED-IN HIGHLIGHT: Minus Dial -->
  <rect x="328" y="215" width="84" height="85" fill="#EF4444" fill-opacity="0.15" stroke="#DC2626" stroke-width="3" rx="12"/>
  <rect x="328" y="196" width="65" height="17" fill="#DC2626" rx="4"/>
  <text x="333" y="209" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Minus (-)</text>

  <g transform="translate(370, 260)">
    <circle cx="0" cy="0" r="30" fill="#334155" stroke="#EF4444" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#EF4444">-</text>
    <text x="0" y="-38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94A3B8">MINUS</text>
  </g>

  <!-- Central View Finder -->
  <circle cx="250" cy="280" r="45" fill="#090D16" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="250" cy="280" r="35" fill="#1E293B" opacity="0.5"/>
</svg>
