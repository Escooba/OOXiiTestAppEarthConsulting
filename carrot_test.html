<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #132033; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .scene {
    perspective: 800px;
    width: 100%;
    height: 100%;
    display: flex; justify-content: center; align-items: center;
  }
  .board {
    transform-style: preserve-3d;
    transform: rotateX(60deg) rotateZ(45deg);
    width: 200px;
    height: 200px;
    background: #3B2818;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 4px;
    padding: 8px;
  }
  .patch {
    background: #26180E;
    transform-style: preserve-3d;
  }
  .carrot {
    position: absolute;
    top: 50%; left: 50%;
    width: 20px; height: 40px;
    background: orange;
    /* counteract */
    transform: translate(-50%, -50%) rotateZ(-45deg) rotateX(-60deg) translateY(-20px);
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="board">
      <div class="patch"><div class="carrot"></div></div>
      <div class="patch"></div>
      <div class="patch"></div>
      <div class="patch"></div>
      <div class="patch"></div>
    </div>
  </div>
</body>
</html>
